
services:
  # DEVELOPMENT
  nextjs-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: bug-tracker-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped

  # PRODUCTION BUILD
  nextjs-build:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: bug-tracker-build
    ports:
      - "3001:3000"
    restart: unless-stopped
